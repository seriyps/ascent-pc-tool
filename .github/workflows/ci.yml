name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'

  web-build-and-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'  # only run when there are changes in `web/`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Package artifact
        run: tar -C web/dist -czf ascent-flasher-web.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascent-flasher-web
          path: ascent-flasher-web.tar.gz

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/CaddxTool.slnx

      - name: Build
        run: dotnet build src/CaddxTool.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/CaddxTool.Protocol.Tests/CaddxTool.Protocol.Tests.csproj --no-build -c Release

      - name: Publish self-contained executable
        run: >
          dotnet publish src/CaddxTool.Avalonia -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/linux-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascent-flasher-linux-x64
          path: publish/linux-x64/ascent-flasher

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained executable
        run: >
          dotnet publish src/CaddxTool.Avalonia -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/linux-x64

      - name: Package release archive
        run: |
          mkdir -p dist
          chmod +x publish/linux-x64/ascent-flasher
          tar -C publish/linux-x64 -czf "dist/ascent-flasher-${{ github.ref_name }}-linux-x64.tar.gz" ascent-flasher

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Package web release archive
        run: tar -C web/dist -czf "dist/ascent-flasher-${{ github.ref_name }}-web.tar.gz" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          body: |
            ### Download

            **`ascent-flasher-${{ github.ref_name }}-linux-x64.tar.gz`** below is the app —
            a self-contained Linux executable, no .NET install required. Extract and run:

            ```bash
            tar xzf ascent-flasher-${{ github.ref_name }}-linux-x64.tar.gz
            ./ascent-flasher
            ```

            **`ascent-flasher-${{ github.ref_name }}-web.tar.gz`** is the browser version —
            unpack it into any static web server's document root and open it over
            `http://` or `https://` (opening `index.html` directly via `file://` won't
            work — Web Serial requires a secure context, which `file://` doesn't count
            as). Requires a Web Serial-capable browser (Chrome/Edge, or Firefox 151+).

            (The "Source code" archives GitHub adds below are just the raw source, not runnable directly.)
